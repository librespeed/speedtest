; speedtest_worker.js defaults xhr_ul_blob_megabytes to 20.
; PHP's stock post_max_size = 8M rejects those upload chunks before
; empty.php can send its headers. 32M leaves modest headroom.

post_max_size = 32M

; LibreSpeed does not use session upload progress. PHP advisories for
; CVE-2026-109619, CVE-2026-115560, and CVE-2026-126714 identify it as a route
; to vulnerable code.
; Updating PHP is the real fix; this only removes a feature nobody here uses.
session.upload_progress.enabled = 0
